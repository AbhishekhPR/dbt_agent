name: Relium PR Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Generate Relium PR review
        run: python -m agent.cli pr-review-demo --output relium_pr_review.md

      - name: Upload Relium PR review
        uses: actions/upload-artifact@v4
        with:
          name: relium-pr-review
          path: relium_pr_review.md
