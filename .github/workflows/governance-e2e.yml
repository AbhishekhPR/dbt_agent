name: governance-e2e

# Manually triggered live proof that "Request changes" is a real GitHub
# pull-request review, submitted by the dedicated Relium E2E App.
#
# It exists because the App credentials live only as Actions secrets, which
# are write-only by design and unavailable on a developer machine. This is the
# only place the live GitHub leg can be proven.
#
# Same shape and same safety rules as metadata-review-e2e: workflow_dispatch
# only, one at a time, webhook restored by a mandatory always-run cleanup, and
# no credential ever written into the workspace or an artifact.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Focused operation to run"
        required: true
        default: "governance"
        type: choice
        options: [governance, blast-radius, semantic-diff, recover-webhook, cleanup-fixtures]
      enforcement_mode:
        description: "Policy mode for the fixture review"
        required: true
        default: "enforce"
        type: choice
        options: [enforce, shadow]

permissions:
  contents: read

concurrency:
  # Shares the group with metadata-review-e2e: both repoint the SAME webhook,
  # so they must never run together.
  group: metadata-review-e2e
  cancel-in-progress: false

jobs:
  governance:
    if: inputs.operation == 'governance'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: bootstrap_only_not_used_by_the_app
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      RELIUM_E2E_REPOSITORY: AbhishekhPR/relium-e2e-dbt
      RELIUM_E2E_APP_SLUG: relium-e2e
      EVIDENCE_DIR: ${{ github.workspace }}/governance-evidence

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the hash-locked dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check

      - name: Install PostgreSQL 18 client tools
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Provision the least-privileged application role
        env:
          PGPASSWORD: bootstrap_only_not_used_by_the_app
        run: |
          APP_PW="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 32)"
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -q <<SQL
          CREATE ROLE relium_app LOGIN PASSWORD '${APP_PW}'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS
            CONNECTION LIMIT 20;
          CREATE DATABASE relium_e2e OWNER relium_app;
          SQL
          psql -h 127.0.0.1 -U postgres -d relium_e2e -v ON_ERROR_STOP=1 -q <<SQL
          ALTER SCHEMA public OWNER TO relium_app;
          SQL
          echo "::add-mask::${APP_PW}"
          echo "RELIUM_DATABASE_URL=postgresql://relium_app:${APP_PW}@127.0.0.1:5432/relium_e2e" >> "$GITHUB_ENV"

      - name: Assert the application role is least-privileged
        env:
          PGPASSWORD: bootstrap_only_not_used_by_the_app
        run: |
          VERDICT="$(psql -h 127.0.0.1 -U postgres -tAc "
            SELECT CASE WHEN NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole
                         AND NOT rolreplication AND NOT rolbypassrls
                        THEN 'LEAST_PRIVILEGED' ELSE 'OVER_PRIVILEGED' END
              FROM pg_roles WHERE rolname='relium_app'")"
          echo "app role: $VERDICT"
          [ "$VERDICT" = "LEAST_PRIVILEGED" ] || exit 1

      - name: Write the App private key outside the workspace
        env:
          RELIUM_GITHUB_PRIVATE_KEY: ${{ secrets.RELIUM_E2E_PRIVATE_KEY }}
        run: |
          # Outside ${{ github.workspace }} so it can never be collected as an
          # artifact, and 600 so nothing else on the runner can read it.
          install -m 700 -d "$RUNNER_TEMP/relium-secrets"
          printf '%s' "$RELIUM_GITHUB_PRIVATE_KEY" > "$RUNNER_TEMP/relium-secrets/app.pem"
          chmod 600 "$RUNNER_TEMP/relium-secrets/app.pem"
          test -s "$RUNNER_TEMP/relium-secrets/app.pem" || { echo "private key secret is empty"; exit 1; }
          echo "RELIUM_GITHUB_PRIVATE_KEY_PATH=$RUNNER_TEMP/relium-secrets/app.pem" >> "$GITHUB_ENV"

      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Run the governance E2E
        id: governance
        env:
          RELIUM_GITHUB_APP_ID: ${{ secrets.RELIUM_E2E_APP_ID }}
          RELIUM_GITHUB_WEBHOOK_SECRET: ${{ secrets.RELIUM_E2E_WEBHOOK_SECRET }}
          RELIUM_E2E_INSTALLATION_ID: ${{ secrets.RELIUM_E2E_INSTALLATION_ID }}
          # Fixture branch/commit/PR operations ONLY. Every application-owned
          # GitHub action in this run is performed by the App installation
          # token, never by this token.
          RELIUM_E2E_FIXTURE_TOKEN: ${{ secrets.RELIUM_E2E_FIXTURE_TOKEN }}
          RELIUM_ENFORCEMENT_MODE: ${{ inputs.enforcement_mode }}
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python scripts/e2e/governance_e2e.py "$EVIDENCE_DIR"

      - name: Scan the evidence for secrets
        if: always()
        run: |
          python scripts/live_e2e/secret_scan.py "$EVIDENCE_DIR" || {
            echo "SECRET SCAN FAILED - refusing to upload evidence"; exit 1; }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-evidence
          path: |
            ${{ env.EVIDENCE_DIR }}/*.json
            ${{ env.EVIDENCE_DIR }}/*.log
          if-no-files-found: warn

      # Mandatory, always. Restores the webhook and closes the fixture PR even
      # on failure, cancellation or timeout. A cleanup failure fails the run.
      - name: Mandatory cleanup
        if: always()
        env:
          RELIUM_GITHUB_APP_ID: ${{ secrets.RELIUM_E2E_APP_ID }}
          RELIUM_E2E_INSTALLATION_ID: ${{ secrets.RELIUM_E2E_INSTALLATION_ID }}
          RELIUM_E2E_FIXTURE_TOKEN: ${{ secrets.RELIUM_E2E_FIXTURE_TOKEN }}
        run: |
          set -o pipefail
          rc=0
          python scripts/e2e/metadata_review_e2e.py "$EVIDENCE_DIR" --cleanup-only || rc=$?
          pkill -f cloudflared || true
          pkill -f uvicorn || true
          pkill -f lifecycle_worker || true
          echo "listeners still up:"; (ss -ltnp | grep -E ':(8000|8080|8791)' || echo none)
          if [ $rc -ne 0 ]; then
            echo "CLEANUP FAILED (rc=$rc)"; exit $rc
          fi

  # Dedicated direct-downstream proof only. This deliberately does not run
  # the governance action flow, metadata variants, a collector, a warehouse,
  # or browser automation. The promoted frontend is not stored in a GitHub
  # repository, so the artifact records that independent browser leg NOT_RUN.
  blast-radius:
    if: inputs.operation == 'blast-radius'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: bootstrap_only_not_used_by_the_app
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      RELIUM_E2E_REPOSITORY: AbhishekhPR/relium-e2e-dbt
      RELIUM_E2E_APP_SLUG: relium-e2e
      EVIDENCE_DIR: ${{ github.workspace }}/blast-radius-evidence

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Record the exact PostgreSQL service
        run: |
          mapfile -t POSTGRES_IDS < <(docker ps --filter ancestor=postgres:18 --format '{{.ID}}')
          if [ "${#POSTGRES_IDS[@]}" -ne 1 ]; then
            echo "expected one PostgreSQL 18 service, found ${#POSTGRES_IDS[@]}"; exit 1
          fi
          echo "POSTGRES_SERVICE_ID=${POSTGRES_IDS[0]}" >> "$GITHUB_ENV"

      - name: Install the application and pinned dbt parse runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-direct-downstream-e2e.txt
          python -m pip check
          dbt --version

      - name: Install PostgreSQL 18 client tools
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Provision the least-privileged application role
        env:
          PGPASSWORD: bootstrap_only_not_used_by_the_app
        run: |
          APP_PW="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 32)"
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -q <<SQL
          CREATE ROLE relium_app LOGIN PASSWORD '${APP_PW}'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS
            CONNECTION LIMIT 20;
          CREATE DATABASE relium_e2e OWNER relium_app;
          SQL
          psql -h 127.0.0.1 -U postgres -d relium_e2e -v ON_ERROR_STOP=1 -q <<SQL
          ALTER SCHEMA public OWNER TO relium_app;
          SQL
          echo "::add-mask::${APP_PW}"
          echo "RELIUM_DATABASE_URL=postgresql://relium_app:${APP_PW}@127.0.0.1:5432/relium_e2e" >> "$GITHUB_ENV"

      - name: Assert the application role is least-privileged
        env:
          PGPASSWORD: bootstrap_only_not_used_by_the_app
        run: |
          VERDICT="$(psql -h 127.0.0.1 -U postgres -tAc "
            SELECT CASE WHEN NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole
                         AND NOT rolreplication AND NOT rolbypassrls
                        THEN 'LEAST_PRIVILEGED' ELSE 'OVER_PRIVILEGED' END
              FROM pg_roles WHERE rolname='relium_app'")"
          echo "app role: $VERDICT"
          [ "$VERDICT" = "LEAST_PRIVILEGED" ] || exit 1

      - name: Write the dedicated E2E App private key outside the workspace
        env:
          RELIUM_GITHUB_PRIVATE_KEY: ${{ secrets.RELIUM_E2E_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/relium-secrets"
          printf '%s' "$RELIUM_GITHUB_PRIVATE_KEY" > "$RUNNER_TEMP/relium-secrets/app.pem"
          chmod 600 "$RUNNER_TEMP/relium-secrets/app.pem"
          test -s "$RUNNER_TEMP/relium-secrets/app.pem" || exit 1
          echo "RELIUM_GITHUB_PRIVATE_KEY_PATH=$RUNNER_TEMP/relium-secrets/app.pem" >> "$GITHUB_ENV"

      - name: Install pinned cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/download/2026.7.2/cloudflared-linux-amd64
          echo "ec905ea7b7e327ff8abdde8cb64697a2152de74dbcdbf6aec9db8364eb3886cd  /tmp/cloudflared" \
            | sha256sum --check --strict
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Run only the blast-radius backend truth E2E
        env:
          RELIUM_GITHUB_APP_ID: ${{ secrets.RELIUM_E2E_APP_ID }}
          RELIUM_GITHUB_WEBHOOK_SECRET: ${{ secrets.RELIUM_E2E_WEBHOOK_SECRET }}
          RELIUM_E2E_INSTALLATION_ID: ${{ secrets.RELIUM_E2E_INSTALLATION_ID }}
          # Branch/file/PR operations only; never App webhook or publication.
          RELIUM_E2E_FIXTURE_TOKEN: ${{ secrets.RELIUM_E2E_FIXTURE_TOKEN }}
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python scripts/e2e/blast_radius_e2e.py "$EVIDENCE_DIR"

      # The durable state this run produced, exported before cleanup stops the
      # service. It exists so the promoted dashboard — which cannot run here —
      # can later be pointed at THIS run's rows instead of a handcrafted
      # replay. Ownership and grants are stripped so the restore target needs
      # no role from this runner; nothing about the review data is altered.
      - name: Export the isolated review database
        env:
          PGPASSWORD: bootstrap_only_not_used_by_the_app
        run: |
          set -o pipefail
          pg_dump -h 127.0.0.1 -U postgres -d relium_e2e \
            --no-owner --no-privileges \
            -f "$EVIDENCE_DIR/blast-radius-review-state.sql"
          test -s "$EVIDENCE_DIR/blast-radius-review-state.sql"
          sha256sum "$EVIDENCE_DIR/blast-radius-review-state.sql" \
            | tee "$EVIDENCE_DIR/blast-radius-review-state.sha256.txt"
          wc -c "$EVIDENCE_DIR/blast-radius-review-state.sql"

      # Always restore/verify the webhook first, close the unmerged owned PR,
      # remove the exact two recorded refs, and stop recorded local processes.
      - name: Mandatory exact blast-radius cleanup
        if: always()
        env:
          RELIUM_GITHUB_APP_ID: ${{ secrets.RELIUM_E2E_APP_ID }}
          RELIUM_E2E_INSTALLATION_ID: ${{ secrets.RELIUM_E2E_INSTALLATION_ID }}
          RELIUM_E2E_FIXTURE_TOKEN: ${{ secrets.RELIUM_E2E_FIXTURE_TOKEN }}
        run: |
          rc=0
          python scripts/e2e/blast_radius_e2e.py "$EVIDENCE_DIR" --cleanup-only || rc=$?
          if ss -ltnp | grep -qE ':(8791|5181)'; then
            echo "BLAST-RADIUS API/FRONTEND LISTENER STILL UP"; rc=1
          fi
          if [ -z "$POSTGRES_SERVICE_ID" ]; then
            echo "POSTGRES SERVICE ID IS UNAVAILABLE"; rc=1
          else
            docker stop "$POSTGRES_SERVICE_ID" || rc=1
          fi
          if ss -ltnp | grep -qE ':(5432)'; then
            echo "BLAST-RADIUS POSTGRES LISTENER STILL UP"; rc=1
          fi
          if [ $rc -ne 0 ]; then
            echo "BLAST-RADIUS CLEANUP FAILED (rc=$rc)"; exit $rc
          fi

      - name: Scan blast-radius evidence for secrets
        id: blast_secret_scan
        if: always()
        run: |
          python scripts/live_e2e/secret_scan.py "$EVIDENCE_DIR" || {
            echo "SECRET SCAN FAILED - refusing to upload evidence"; exit 1; }

      - name: Upload blast-radius evidence
        if: always() && steps.blast_secret_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: blast-radius-backend-truth
          path: |
            ${{ env.EVIDENCE_DIR }}/*.json
            ${{ env.EVIDENCE_DIR }}/*.log
            ${{ env.EVIDENCE_DIR }}/*.sql
            ${{ env.EVIDENCE_DIR }}/*.sha256.txt
          if-no-files-found: error

  # Dispatch-mechanics probe ONLY. It touches no webhook, no fixture branch and
  # no PR, and uses no secret. It exists to answer one question before any
  # harness is written: can workflow_dispatch run a NEW operation value at a
  # feature ref while main still carries the old input definition? The real
  # semantic-diff job replaces this once that is known.
  semantic-diff:
    if: inputs.operation == 'semantic-diff'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the ref this workflow definition came from
        run: |
          echo "operation input accepted at ref: ${{ github.ref }}"
          echo "sha: ${{ github.sha }}"
          echo "NO remote mutation performed by this probe."

  webhook-recovery:
    if: inputs.operation == 'recover-webhook'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELIUM_E2E_REPOSITORY: AbhishekhPR/relium-e2e-dbt
      RELIUM_E2E_APP_SLUG: relium-e2e
      EVIDENCE_DIR: ${{ github.workspace }}/webhook-recovery-evidence

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Write the dedicated E2E App private key outside the workspace
        env:
          RELIUM_GITHUB_PRIVATE_KEY: ${{ secrets.RELIUM_E2E_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/relium-secrets"
          printf '%s' "$RELIUM_GITHUB_PRIVATE_KEY" > "$RUNNER_TEMP/relium-secrets/app.pem"
          chmod 600 "$RUNNER_TEMP/relium-secrets/app.pem"
          test -s "$RUNNER_TEMP/relium-secrets/app.pem" || exit 1
          echo "RELIUM_GITHUB_PRIVATE_KEY_PATH=$RUNNER_TEMP/relium-secrets/app.pem" >> "$GITHUB_ENV"

      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Recover and prove exact webhook cleanup
        env:
          RELIUM_GITHUB_APP_ID: ${{ secrets.RELIUM_E2E_APP_ID }}
          RELIUM_E2E_INSTALLATION_ID: ${{ secrets.RELIUM_E2E_INSTALLATION_ID }}
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python scripts/e2e/webhook_recovery_e2e.py "$EVIDENCE_DIR"

      - name: Mandatory outer cleanup and exact restore
        if: always()
        env:
          RELIUM_GITHUB_APP_ID: ${{ secrets.RELIUM_E2E_APP_ID }}
        run: |
          rc=0
          python scripts/e2e/metadata_review_e2e.py "$EVIDENCE_DIR" --webhook-restore-only || rc=$?
          pkill -f cloudflared || true
          pkill -f webhook_recovery_e2e.py || true
          if [ $rc -ne 0 ]; then
            echo "CLEANUP FAILED (rc=$rc)"; exit $rc
          fi
          if ss -ltnp | grep -qE ':(8791)'; then
            echo "E2E LISTENER STILL UP"; exit 1
          fi
          if pgrep -f cloudflared; then
            echo "E2E TUNNEL STILL UP"; exit 1
          fi

      - name: Scan recovery evidence for secrets
        if: always()
        run: |
          python scripts/live_e2e/secret_scan.py "$EVIDENCE_DIR" || {
            echo "SECRET SCAN FAILED - refusing to upload evidence"; exit 1; }

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webhook-recovery-cleanup-proof
          path: |
            ${{ env.EVIDENCE_DIR }}/*.json
            ${{ env.EVIDENCE_DIR }}/*.log
          if-no-files-found: error

  fixture-cleanup:
    if: inputs.operation == 'cleanup-fixtures'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/fixture-cleanup-evidence

    steps:
      - uses: actions/checkout@v4

      - name: Close stale fixture PRs and delete ephemeral branches
        env:
          RELIUM_E2E_FIXTURE_TOKEN: ${{ secrets.RELIUM_E2E_FIXTURE_TOKEN }}
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python scripts/e2e/cleanup_stale_fixtures.py "$EVIDENCE_DIR"

      - name: Scan fixture-cleanup evidence for secrets
        if: always()
        run: |
          python scripts/live_e2e/secret_scan.py "$EVIDENCE_DIR" || {
            echo "SECRET SCAN FAILED - refusing to upload evidence"; exit 1; }

      - name: Upload fixture-cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stale-fixture-cleanup
          path: ${{ env.EVIDENCE_DIR }}/*.json
          if-no-files-found: error
