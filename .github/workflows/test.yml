name: Run Relium Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest discover -s . -p "test_*.py" -v
        env:
          # Prevent tests from requiring real API keys
          GROQ_API_KEY: ""
          SLACK_WEBHOOK_URL: ""
          ENABLE_AI_EXPLAINER: "false"

      - name: Test summary
        if: always()
        run: |
          echo "Test run completed. Check logs for any failures."
