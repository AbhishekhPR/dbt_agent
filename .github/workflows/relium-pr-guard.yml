name: Relium PR Guard

on:
  pull_request:

jobs:
  pr-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install click python-dotenv sqlglot groq

      - name: Run Relium PR Guard
        run: python main.py pr_guard --project business_demo --fail-on high
