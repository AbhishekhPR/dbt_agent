name: Relium PR Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Collect changed files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed_files.txt
          cat changed_files.txt

      - name: Ensure dbt manifest exists
        shell: bash
        run: |
          set -euo pipefail
          # dbt compile must run before Relium so target/manifest.json exists.
          # Add your project-specific dbt deps/compile commands before this check
          # if the manifest is not already generated by an earlier workflow step.
          if [ ! -f target/manifest.json ]; then
            echo "::error::target/manifest.json not found. Run dbt compile before Relium PR review."
            exit 1
          fi

      - name: Generate Relium PR review
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_files < changed_files.txt

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "Relium skipped: no changed dbt models detected." > relium-review.md
            exit 0
          fi

          command=(
            python -m agent.cli review-deployment
            --dbt-manifest target/manifest.json
            --history-path .relium/deployment_history.json
            --deployment-id "pr-${{ github.event.pull_request.number }}-${{ github.sha }}"
            --format markdown
            --output relium-review.md
          )

          for file in "${changed_files[@]}"; do
            command+=(--changed-file "$file")
          done

          set +e
          "${command[@]}" 2>&1 | tee relium-review.log
          exit_code="${PIPESTATUS[0]}"
          set -e

          if [ "$exit_code" -eq 0 ]; then
            exit 0
          fi

          if grep -q "At least one changed model is required" relium-review.log; then
            echo "Relium skipped: no changed dbt models detected." > relium-review.md
            exit 0
          fi

          exit "$exit_code"

      - name: Upload Relium PR review
        uses: actions/upload-artifact@v4
        with:
          name: relium-pr-review
          path: relium-review.md

      - name: Comment Relium PR review
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- relium-pr-review -->';
            const markdown = fs.readFileSync('relium-review.md', 'utf8');
            const body = `${marker}\n\n${markdown}`;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const existing = comments.find((comment) =>
              comment.body && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
