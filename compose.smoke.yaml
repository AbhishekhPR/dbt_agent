services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relium
      POSTGRES_USER: relium
      POSTGRES_PASSWORD: ${RELIUM_SMOKE_POSTGRES_PASSWORD:?Set a local smoke-test database password}
    ports:
      - "127.0.0.1:${RELIUM_SMOKE_POSTGRES_PORT:-55443}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relium -d relium"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: relium-backend:smoke
    environment:
      RELIUM_DATABASE_URL: postgresql://relium:${RELIUM_SMOKE_POSTGRES_PASSWORD:?Set a local smoke-test database password}@postgres:5432/relium
      RELIUM_STORAGE_ROOT: /data/relium
      RELIUM_GITHUB_APP_ID: ${RELIUM_SMOKE_GITHUB_APP_ID:-1}
      RELIUM_GITHUB_WEBHOOK_SECRET: ${RELIUM_SMOKE_WEBHOOK_SECRET:?Set a local smoke-test webhook secret}
      RELIUM_GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_private_key
      RELIUM_METADATA_REVIEW_ENVIRONMENT: docker-smoke
      RELIUM_CORS_ALLOWED_ORIGINS: ${RELIUM_SMOKE_WEB_ORIGIN:-http://127.0.0.1:5280}
      RELIUM_HOST: 0.0.0.0
      RELIUM_PORT: 8000
      RELIUM_WORKER_COUNT: 1
    secrets:
      - github_private_key
    ports:
      - "127.0.0.1:${RELIUM_SMOKE_API_PORT:-8199}:8000"
    volumes:
      - api_storage:/data/relium
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5).read()"
      interval: 5s
      timeout: 6s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  worker:
    image: relium-backend:smoke
    command: ["python", "-m", "agent.worker.lifecycle_worker"]
    environment:
      RELIUM_DATABASE_URL: postgresql://relium:${RELIUM_SMOKE_POSTGRES_PASSWORD:?Set a local smoke-test database password}@postgres:5432/relium
      RELIUM_GITHUB_APP_ID: ${RELIUM_SMOKE_GITHUB_APP_ID:-1}
      RELIUM_GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_private_key
      RELIUM_WORKER_REQUIRE_PUBLISHER: "true"
    secrets:
      - github_private_key
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../relium-app
      dockerfile: Dockerfile
      args:
        VITE_RELIUM_API_URL: ${RELIUM_SMOKE_API_ORIGIN:-http://127.0.0.1:8199}
        VITE_RELIUM_OWNER: docker-smoke
        VITE_RELIUM_REPOSITORY: deployment-proof
        VITE_RELIUM_ENVIRONMENT: docker-smoke
    image: relium-app:smoke
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "127.0.0.1:${RELIUM_SMOKE_WEB_PORT:-5280}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  api_storage:

secrets:
  github_private_key:
    file: ${RELIUM_SMOKE_PRIVATE_KEY_FILE:?Set the path to an ephemeral smoke-test RSA private key}
