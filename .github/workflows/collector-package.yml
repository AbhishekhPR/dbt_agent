name: Collector package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build collector wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Smoke-test installed collector
        run: |
          python -m venv smoke
          smoke/bin/pip install dist/*.whl
          smoke/bin/relium collect --help
      - name: Generate and verify checksum manifest
        working-directory: dist
        run: |
          sha256sum *.whl > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Upload wheel and checksum together
        uses: actions/upload-artifact@v4
        with:
          name: relium-collector-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/SHA256SUMS
