name: Run Relium Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: relium_ci
          POSTGRES_PASSWORD: relium_ci_password  # pragma: allowlist secret -- ephemeral CI-only service-container password, not a real credential
          POSTGRES_DB: relium_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Run tests
        run: |
          python -m unittest discover -s . -p "test_*.py" -v
        env:
          # Prevent tests from requiring real API keys
          GROQ_API_KEY: ""
          SLACK_WEBHOOK_URL: ""
          ENABLE_AI_EXPLAINER: "false"
          RELIUM_TEST_POSTGRES_DSN: "postgresql://relium_ci:relium_ci_password@127.0.0.1:5432/relium_ci"  # pragma: allowlist secret

      - name: Test summary
        if: always()
        run: |
          echo "Test run completed. Check logs for any failures."
